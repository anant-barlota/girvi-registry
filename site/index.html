<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Girvi plugins</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #666; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151515; --fg: #eee; --muted: #999; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 36rem; margin: 0 auto; padding: 3rem 16px; }
  p { color: var(--muted); }
  a { color: inherit; }
  code { font-size: .9em; }
</style>
</head>
<body>
<main>
  <h1>Girvi plugins</h1>
  <p>This is the catalog the Girvi app reads to list plugins. Open <strong>Plugins</strong> in Girvi and choose <strong>Browse</strong> to install one.</p>
  <p>The list itself is <a href="index.json"><code>index.json</code></a>. To list your own plugin, see the <a href="https://github.com/anant-barlota/girvi-registry#list-your-plugin">guide</a>.</p>
</main>
</body>
</html>
