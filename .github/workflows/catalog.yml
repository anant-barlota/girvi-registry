# Checks the catalog and publishes it when it reaches main. A proposed change is
# checked by catalog-pr.yml.
name: Catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The girvi-sdk release whose rules the catalog follows. Go's checksum
  # database makes a released version immutable, so this pin cannot change.
  GIRVI_SDK: v0.0.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - run: go run "github.com/anant-barlota/girvi-sdk/cmd/girvi@${GIRVI_SDK}" registry check

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assemble the site
        run: |
          mkdir -p public
          cp index.json public/index.json
          cp site/index.html public/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
